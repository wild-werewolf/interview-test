services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: deal_calculation
      POSTGRES_USER: deal
      POSTGRES_PASSWORD: deal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deal -d deal_calculation"]
      interval: 5s
      timeout: 3s
      retries: 10
